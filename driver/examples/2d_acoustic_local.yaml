name: example_2d_acoustic
description: Minimal 2D constant-velocity acoustic forward run on a laptop.
simulation:
  dimension: 2
  order: 4
  mode: forward
  time:
    steps: 200
    dt: 5e-4
    cfl_factor: 0.5
  log_interval: 200
mesh:
  type: internal
  origin:
  - 0.0
  - 0.0
  size:
  - 1000.0
  - 1000.0
  elements:
  - 10
  - 10
  max_freq: 30.0
  ppw: 5.0
material:
  type: isotropic_acoustic
  format: constant
  vp: 1500.0
  rho: 1000.0
device:
  type: cpu
boundary: {}
receivers:
  type:
  - PS
sources: {}
run:
  binary: semsws    # bare name → resolved via $PATH (e.g. spack load semsws)
  scheduler: local
  launcher: local
  ranks_per_shot: 2
  device_kind: cpu
  shots_per_job: 2
vis:
  wavefield:
    enabled: false
