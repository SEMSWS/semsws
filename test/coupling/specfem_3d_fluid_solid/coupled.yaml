name: SEMSWS coupled vs SPECFEM3D (fluid-solid, moment-tensor source)
simulation:
  dimension: 3
  order: 4
  dt: 0.0005
  steps: 4000
  cfl_factor: 0.3
  directory: ./out
  log_interval: 500
mesh:
  type: external
  file: probe.msh
  max_freq: 14.0
  ppw: 5.0
material:
  type: coupled
  fluid:
    attribute: 1
    type: isotropic_acoustic
    format: constant
    vp: 1500.0
    rho: 1000.0
  solid:
    attribute: 2
    type: isotropic_elastic
    format: constant
    vp: 3000.0
    vs: 1732.0
    rho: 2500.0
boundary: {}
sources:
  list:
  - type: moment_tensor
    location:
    - 837.0
    - 419.0
    - 1223.0
    moment_tensor:
      Mxx: 1000000000000000.0
      Myy: 1000000000000000.0
      Mzz: 1000000000000000.0
      Mxy: 0.0
      Mxz: 0.0
      Myz: 0.0
    wavelet:
      type: ricker
      frequency: 5.0
      delay: 0.3
      amplitude: 1.0
receivers:
  output:
    formats:
    - ascii
    filename: rcv
  type:
  - PS
  - DISP
  - VEL
  - ACC
  list:
  - name: R01
    location:
    - 800.0
    - 400.0
    - 400.0
  - name: R02
    location:
    - 800.0
    - 400.0
    - 880.0000000000001
  - name: R03
    location:
    - 800.0
    - 400.0
    - 1360.0
device:
  type: cpu
