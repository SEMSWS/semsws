name: SEMSWS coupled vs SPECFEM2D (2D fluid-solid, force source)
simulation:
  dimension: 2
  order: 4
  dt: 0.0005
  steps: 4000
  cfl_factor: 0.3
  directory: ./results
  log_interval: 500
  summary_file: summary.txt
mesh:
  type: external
  file: probe.msh
  max_freq: 14.0
  ppw: 5.0
material:
  type: coupled
  fluid:
    attribute: 2
    type: isotropic_acoustic
    format: constant
    vp: 1500.0
    rho: 1000.0
    attenuation:
      enabled: false
      f0: 5
      n_units: 3
      qkappa: 9999
  solid:
    attribute: 1
    type: isotropic_elastic
    format: constant
    vp: 3000.0
    vs: 1732.0
    rho: 2500.0
    attenuation:
      enabled: false
      f0: 5
      n_units: 3
      qkappa: 9999
      qmu: 9999
boundary:
  dirichlet:
  - 1
  - 2
  - 3
  - 4
sources:
  list:
  - type: force
    location:
    - 817.0
    - 213.0
    direction:
    - 0.0
    - -1.0
    wavelet:
      type: ricker
      frequency: 5.0
      delay: 0.3
      amplitude: 10000000000.0
receivers:
  output:
    formats:
    - ascii
    filename: rcv
    buffer_steps: 100
  type:
  - PS
  - DISP
  - VEL
  - ACC
  list:
  - name: R001
    location:
    - 800.0
    - 200.0
  - name: R002
    location:
    - 800.0
    - 440.00000000000006
  - name: R003
    location:
    - 800.0
    - 680.0
device:
  type: cuda
vis:
  wavefield:
    enabled: false
    interval: 500
    formats:
    - glvis
