name: Acoustic Homogeneous 2D
simulation:
  dimension: 2
  order: 4
  steps: 10000
  dt: 0.0001
  cfl_factor: 0.3
  directory: ./results
  log_interval: 200
  summary_file: summary.txt
mesh:
  type: internal
  origin:
  - 0.0
  - 0.0
  size:
  - 1000.0
  - 500.0
  elements:
  - 100
  - 50
  max_freq: 75.0
  ppw: 5.0
material:
  type: isotropic_acoustic
  format: constant
  vp: 1500.0
  rho: 1000.0
  attenuation:
    enabled: true
    f0: 1.0
    n_units: 3
    qkappa: 10.0
boundary:
  absorbing:
    sides: []
    thickness: 200.0
    alpha: 0.008
  dirichlet:
  - top
  - right
  - left
  - bottom
sources:
  shot_id: 1
  list:
  - type: pressure
    location:
    - 500.0
    - 499.0
    wavelet:
      type: ricker
      frequency: 30.0
      amplitude: 1.0e10
      delay: 0.05
receivers:
  output:
    formats:
    - ascii
    filename: seismograms
  type:
  - PS
  list:
  - name: R001
    location:
    - 400.0
    - 300.0
  - name: R002
    location:
    - 450.0
    - 300.0
  - name: R003
    location:
    - 500.0
    - 300.0
  - name: R004
    location:
    - 550.0
    - 300.0
  - name: R005
    location:
    - 600.0
    - 300.0
device:
  type: cpu
vis:
  wavefield:
    enabled: false
    interval: 500
    formats:
    - glvis
