name: test elastic 2D
simulation:
  dimension: 2
  order: 4
  steps: 10000
  dt: 0.0001
  cfl_factor: 0.3
  directory: ./results
  log_interval: 200
  summary_file: summary.txt
mesh:
  type: internal
  origin:
  - 0.0
  - 0.0
  size:
  - 4000.0
  - 2000.0
  elements:
  - 200
  - 100
  max_freq: 50.0
  ppw: 5.0
material:
  type: isotropic_elastic
  format: constant
  vp: 3000.0
  vs: 1732.0
  rho: 2500.0
  attenuation:
    enabled: false
boundary:
  absorbing:
    sides: []
    thickness: 500.0
    alpha: 6
  dirichlet: []
sources:
  shot_id: 1
  list:
  - type: force
    location:
    - 700.0
    - 1999.0
    direction:
    - 0.0
    - -1.0
    wavelet:
      type: ricker
      frequency: 20.0
      delay: 0.1
      amplitude: 1.0e9
receivers:
  output:
    formats:
    - ascii
    filename: dummy
    buffer_steps: 100
  type:
  - DISP
  list:
  - name: REC00
    location:
    - 800.0
    - 1000.0
  - name: REC01
    location:
    - 900.0
    - 1000.0
  - name: REC02
    location:
    - 1000.0
    - 1000.0
  - name: REC03
    location:
    - 1100.0
    - 1000.0
  - name: REC04
    location:
    - 1200.0
    - 1000.0
device:
  type: hip
vis:
  wavefield:
    enabled: false
    interval: 1000
    formats:
    - glvis
