name: 3D ELASTIC
simulation:
  dimension: 3
  order: 4
  dt: 0.001
  steps: 4000
  cfl_factor: 0.3
  directory: ./results
  log_interval: 100
  summary_file: summary.txt
mesh:
  type: internal
  origin:
  - 0.0
  - 0.0
  - 0.0
  size:
  - 5000.0
  - 5000.0
  - 5000.0
  elements:
  - 20
  - 20
  - 20
  max_freq: 2.5
  ppw: 5.0
material:
  type: isotropic_elastic
  format: constant
  file: tmp.dat
  vp: 3000.0
  vs: 1732.0
  rho: 2500.0
  attenuation:
    enabled: true
    f0: 1.0
    n_units: 3
    qkappa: 10.0
    qmu: 10.0
boundary:
  absorbing:
    sides: []
    thickness: 1200.0
    alpha: 6
  dirichlet: []
sources:
  list:
  - type: moment_tensor
    location:
    - 2500
    - 2500.0
    - 2500.0
    moment_tensor:
      Mxx: 0
      Myy: 0
      Mzz: 0
      Mxy: -1.0
      Mxz: 1.0
      Myz: -1.0
    wavelet:
      type: ricker
      frequency: 1.0
      delay: 1.2
      amplitude: 1.0e10
receivers:
  output:
    formats:
    - ascii
    filename: seismograms.h5
    buffer_steps: 100
  type:
  - DISP
  - VEL
  list:
  - name: R01
    location:
    - 2500.0
    - 3000.0
    - 4999.0
  - name: R02
    location:
    - 2500.0
    - 3500.0
    - 4999.0
  - name: R03
    location:
    - 2500.0
    - 4000.0
    - 4999.0
  - name: R04
    location:
    - 3000.0
    - 2500.0
    - 4999.0
  - name: R05
    location:
    - 3500.0
    - 2500.0
    - 4999.0
device:
  type: hip
vis:
  wavefield:
    enabled: false
    interval: 500
    formats:
    - glvis
