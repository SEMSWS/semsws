name: 3D Viscoelastic 2-Layer Benchmark (Cubit mesh, refined)
simulation:
  dimension: 3
  order: 4
  dt: 0.0005
  steps: 12000
  cfl_factor: 0.3
  directory: ./results
  log_interval: 1000
  summary_file: summary.txt
mesh:
  type: prepart_mfem
  prepart_mfem:
    directory: mesh
    nparts: 64
  ppw: 5
  max_freq: 5.6
material:
  type: isotropic_elastic
  format: by_attribute
  file: materials_visco.txt
  attenuation:
    enabled: true
    f0: 2.0
    n_units: 3
boundary:
  absorbing:
    sides: []
    thickness: 1500.0
    alpha: 0.6
sources:
  list:
  - type: moment_tensor
    location:
    - 5000.0
    - 5000.0
    - -3000.0
    moment_tensor:
      Mxx: 0.2048
      Myy: -0.6687
      Mzz: 0.4639
      Mxy: 0.635
      Mxz: -0.3415
      Myz: -1.586
    wavelet:
      type: ricker
      frequency: 2.0
      delay: 1.0
      amplitude: 1.0e10
receivers:
  output:
    formats:
    - ascii
  type:
  - DISP
  - VEL
  list:
  - name: R01
    location:
    - 5000.0
    - 6000.0
    - 0.0
  - name: R02
    location:
    - 5000.0
    - 7000.0
    - 0.0
  - name: R03
    location:
    - 5000.0
    - 8000.0
    - 0.0
  - name: R04
    location:
    - 6000.0
    - 5000.0
    - 0.0
  - name: R05
    location:
    - 7000.0
    - 5000.0
    - 0.0
device:
  type: cpu
vis:
  wavefield:
    components:
    - -1
    - 0
    - 1
    - 2
    enabled: true
    interval: 500
    fields:
    - DISP
    formats:
    - glvis
    - type: paraview
      refinement: 1
      data_format: binary32
    - type: gmt
      resolution:
      - 200
      - 200
      cross_sections:
        yz:
        - 5000.0
        xz:
        - 5000.0
        xy:
        - -3000.0
  material:
    enabled: true
    fields:
    - vp
    - vs
    - rho
    formats:
    - type: gmt
      resolution:
      - 200
      - 200
      cross_sections:
        yz:
        - 5000.0
        xz:
        - 5000.0
        xy:
        - -3000.0
