name: Visualization Test - 2D Acoustic
simulation:
  dimension: 2
  order: 4
  steps: 10000
  dt: 0.0001
  cfl_factor: 0.3
  directory: ./results
  log_interval: 1000
  summary_file: summary.txt
mesh:
  type: internal
  origin:
  - 0.0
  - 0.0
  size:
  - 1000.0
  - 500.0
  elements:
  - 50
  - 25
  max_freq: 75.0
  ppw: 5.0
material:
  type: isotropic_acoustic
  format: constant
  vp: 1500.0
  rho: 1000.0
  attenuation:
    enabled: false
boundary:
  absorbing:
    sides: []
    thickness: 100.0
    alpha: 0.008
  dirichlet:
  - top
  - right
  - left
  - bottom
sources:
  shot_id: 1
  list:
  - type: pressure
    location:
    - 500.0
    - 400.0
    wavelet:
      type: ricker
      frequency: 30.0
      amplitude: 1.0e10
      delay: 0.05
receivers:
  output:
    formats:
    - ascii
    filename: seismograms
  type:
  - PS
  list:
  - name: R001
    location:
    - 400.0
    - 300.0
  - name: R002
    location:
    - 500.0
    - 300.0
  - name: R003
    location:
    - 600.0
    - 300.0
device:
  type: cpu
vis:
  wavefield:
    components:
    - -1
    enabled: true
    interval: 1000
    fields:
    - PS
    formats:
    - glvis
    - type: paraview
      refinement: 4
      data_format: binary32
    - type: gmt
      resolution:
      - 100
      - 50
  material:
    enabled: true
    fields:
    - vp
    - rho
    formats:
    - glvis
    - type: paraview
      refinement: 4
      data_format: binary32
    - type: gmt
      resolution:
      - 100
      - 50
  mesh:
    enabled: true
