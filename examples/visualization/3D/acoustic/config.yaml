name: Visualization Test - 3D Acoustic
simulation:
  dimension: 3
  order: 4
  dt: 0.005
  steps: 1200
  cfl_factor: 0.3
  directory: ./results
  log_interval: 100
  summary_file: summary.txt
mesh:
  type: internal
  origin:
  - 0.0
  - 0.0
  - 0.0
  size:
  - 24000.0
  - 24000.0
  - 20000.0
  elements:
  - 20
  - 20
  - 18
  max_freq: 2.5
  ppw: 5.0
material:
  type: isotropic_acoustic
  format: constant
  vp: 3500.0
  rho: 2300.0
  attenuation:
    enabled: false
boundary:
  absorbing:
    sides:
    - bottom
    - right
    - left
    - front
    - back
    - top
    thickness: 1200.0
    alpha: 0.3
  dirichlet: []
sources:
  list:
  - type: pressure
    location:
    - 12000.0
    - 12000.0
    - 12000.0
    wavelet:
      type: ricker
      frequency: 1.0
      delay: 1.5
      amplitude: 1.0e10
receivers:
  output:
    formats:
    - ascii
    filename: seismograms
  type:
  - PS
  list:
  - name: R1
    location:
    - 15000.0
    - 13000.0
    - 8000.0
  - name: R2
    location:
    - 13000.0
    - 15000.0
    - 8000.0
  - name: R3
    location:
    - 18000.0
    - 13000.0
    - 8000.0
device:
  type: cpu
vis:
  wavefield:
    components:
    - -1
    enabled: true
    interval: 100
    fields:
    - PS
    formats:
    - glvis
    - type: paraview
      refinement: 4
      data_format: binary32
    - type: gmt
      resolution:
      - 100
      - 100
      cross_sections:
        yz:
        - 12000.0
        xz:
        - 12000.0
        xy:
        - 12000.0
  material:
    enabled: true
    fields:
    - vp
    - rho
    formats:
    - glvis
    - type: paraview
      refinement: 4
      data_format: binary32
    - type: gmt
      resolution:
      - 100
      - 100
      cross_sections:
        yz:
        - 12000.0
        xz:
        - 12000.0
        xy:
        - 12000.0
  mesh:
    enabled: true
