name: ICM Elastic 2D
simulation:
  dimension: 2
  order: 8
  steps: 60000
  dt: 5.0e-05
  cfl_factor: 0.3
  directory: ./results
  log_interval: 50
  summary_file: summary.txt
mesh:
  type: external
  file: icm.msh
  max_freq: 24.0
  ppw: 5
material:
  type: isotropic_elastic
  format: constant
  vp: 3000.0
  vs: 1732.0
  rho: 2500.0
  attenuation:
    enabled: false
boundary:
  absorbing:
    sides: []
    thickness: 500.0
    alpha: 0.4
  dirichlet: []
sources:
  shot_id: 1
  list:
  - type: moment_tensor
    location:
    - 1293.0
    - 2107.0
    moment_tensor:
      Mxx: 1.0
      Myy: 1.0
      Mxy: 0
    wavelet:
      type: ricker
      frequency: 10.0
      amplitude: 1.0e10
      delay: 0.12
receivers:
  output:
    formats:
    - ascii
    filename: seismograms
  type:
  - DISP
  list:
  - name: R_top
    location:
    - 3000.0
    - 2800.0
  - name: R_bottom
    location:
    - 3000.0
    - 200.0
  - name: R_left
    location:
    - 200.0
    - 1500.0
  - name: R_right
    location:
    - 5800.0
    - 1500.0
device:
  type: cpu
vis:
  wavefield:
    components:
    - -1
    - 0
    - 1
    enabled: true
    interval: 100
    fields:
    - DISP
    formats:
    - type: paraview
      refinement: 2
      data_format: binary32
    - type: gmt
      resolution:
      - 600
      - 300
  material:
    enabled: true
    fields:
    - vp
    - vs
    - rho
    formats:
    - type: paraview
      refinement: 2
      data_format: binary32
